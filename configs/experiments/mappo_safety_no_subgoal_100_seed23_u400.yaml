  initial_action_log_std: -0.7
train:
  total_updates: 400
  rollout_steps: 2048
  ppo_epochs: 4
  sequence_length: 32
  sequence_minibatch_size: 32
  critic_minibatch_size: 1024
  target_kl: 0.02
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
