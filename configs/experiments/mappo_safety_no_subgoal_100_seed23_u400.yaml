  log_std_min: -3.0
  log_std_max: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  max_grad_norm: 0.5
  save_every: 100
  save_periodic_checkpoints: true
  log_every: 10
  intervention_aware:
    mode: disabled
  checkpoint_updates:
  - 100
  - 200
  - 400
evaluation:
  episodes: 10
  interval_updates: 100
  seed_base: 111000
  save_episode_records: true
  updates:
  - 100
  - 200
  - 400
