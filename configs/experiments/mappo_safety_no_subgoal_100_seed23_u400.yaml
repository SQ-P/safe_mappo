    no_safe_candidate_mode: safe_brake
  obstacle_execution_diagnostics:
    enabled: true
    ttc_horizon_seconds: 10.0
  obstacle_ttc:
    enabled: true
    version: causal_ttc_progress_projection_v2
    horizon_seconds: 10.0
    warning_ttc_seconds: 5.0
    emergency_ttc_seconds: 2.5
  goal_boundary_corridor:
    enabled: false
    version: goal_boundary_corridor_v1
    corridor_coordinate: 94.0
  ttc_headroom_audit:
    enabled: false
    shadow_steps: 3
    minimum_goal_velocity_gain_mps: 0.1
    maximum_extra_actor_deviation: 0.25
  closure_trace_audit:
    enabled: false
  recovery:
    exit_stable_steps: 3
    maximum_steps: 20
    target_distance: 6.0
    speed_fraction: 0.5
    boundary_trigger_margin: 1.0
    boundary_stall_patience_steps: 3
    minimum_displacement_m: 0.05
    obstacle_repulsion_margin_m: 4.0
    attempt_steps: 20
    maximum_attempts: 1
    exclude_goal_agents: true
    progress_patience_steps: 3
    maximum_refreshes: 4
    minimum_margin_improvement_m: 0.01
    direction_unavailable_patience_steps: 3
    escape_steps: 14
    consolidation_steps: 6
    release_hysteresis_m: 0.25
    rapid_retrigger_window_steps: 5
    lineage_max_incidents: 2
    lineage_max_steps: 40
    shadow_horizon_steps: 3
    candidate_fixed_point_patience_steps: 2
    candidate_minimum_margin_gain_m: 0.01
  final_joint_guard:
    enabled: true
  telemetry:
    schema: StageInterventionTraceV1
    any_action_l2: 1.0e-07
    material_delta_v_mps: 0.05
    large_delta_v_mps: 0.25
