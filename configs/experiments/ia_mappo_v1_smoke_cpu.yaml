extends: ../active/ia_mappo_v1_3u_6s1d_standard.yaml

device: cpu

model:
  hidden_dim: 32

train:
  total_updates: 1
  rollout_steps: 8
  ppo_epochs: 1
  sequence_length: 4
  sequence_minibatch_size: 4
  critic_minibatch_size: 8
  save_every: 1
  save_periodic_checkpoints: false
  log_every: 1
  intervention_aware:
    mode: disabled

evaluation:
  episodes: 1
  interval_updates: 1
  seed_base: 91000
  save_episode_records: true

output:
  output_dir: results/ia_mappo_v1/smoke_cpu
  checkpoint_dir: results/ia_mappo_v1/smoke_cpu/checkpoints
  reject_nonempty: true
