# Minimal active task contract. Historical experiment configs remain immutable.
device: cuda
seed: 23

env:
  num_agents: 2
  map_size: [100.0, 100.0]
  agent_radius: 1.5
  agent_max_speed: 2.0
  agent_max_acceleration: 1.0
  dt: 0.5
  max_episode_steps: 300
  start_x: 5.0
  start_y_positions: [35.0, 65.0]
  start_y_jitter: 2.0
  goal_x: 95.0
  goal_y_positions: [35.0, 65.0]
  cross_goals: true
  goal_radius: 3.0
  static_obstacle_num: 4
  dynamic_obstacle_num: 0
  obstacle_radius_range: [2.0, 5.0]
  dynamic_obstacle_velocity_range: [-1.0, 1.0]
  obstacle_spawn_clearance: 2.0
  obstacle_spawn_x_range: [15.0, 85.0]
  obstacle_spawn_y_range: [8.0, 92.0]
  detection_radius: 25.0
  obstacle_slots: 6
  boundary_recovery_distance: 1.0
  collision_mode: terminal
  boundary_mode: collision
  reward_mode: team_v4_subgoal
  evidence_window_steps: 20
  observation_schema_version: tracked_obstacle_v2
  obstacle_selection_version: predicted_clearance_v1
  obstacle_velocity_estimation_version: causal_track_difference_v1
  near_goal_stall_action_threshold: 0.001
  near_goal_stall_distance_margin: 3.0
  near_goal_stall_patience_steps: 20
  proximity_risk: {margin: 3.0, max_penalty: 0.05}
  render_width: 600
  render_height: 600

reward:
  subgoal_progress_scale: 0.25
  final_progress_scale: 8.0
  bottleneck_weight: 0.30
  goal_success_bonus: 30.0
  collision_penalty: 20.0
  timeout_penalty: 5.0
  step_penalty: 0.002
  control_effort_weight: 0.0

oracle_subgoal:
  enabled: true
  lifecycle_version: per_agent_v2
  target_identity_tolerance: 0.00001
  replanning_interval: 20
  lookahead_distance: 9.0
  sensor_range: 25.0
  attractive_gain: 1.0
  obstacle_repulsive_gain: 80.0
  teammate_repulsive_gain: 60.0
  obstacle_safety_margin: 1.5
  teammate_safety_distance: 6.0
  subgoal_reach_radius: 2.0
  min_subgoal_distance: 3.0
  recovery_enabled: true
  recovery_angle_offsets_degrees: [30.0, -30.0, 60.0, -60.0, 90.0, -90.0]
  recovery_lookahead_distances: [9.0, 6.0, 3.0]
  recovery_goal_progress_weight: 1.0
  recovery_clearance_weight: 0.10
  recovery_turn_penalty_weight: 0.02
  final_goal_fallback_requires_clear_path: true

# Frozen Oracle subgoals are the N-agent-compatible active default.
subgoal_selector:
  enabled: false

observation_normalization:
  enabled: true
  version: fixed_scale_v2_tracked_obstacles

model:
  hidden_dim: 128
  initial_action_log_std: -0.7

train:
  total_updates: 400
  rollout_steps: 2048
  ppo_epochs: 4
  sequence_length: 32
  sequence_minibatch_size: 32
  critic_minibatch_size: 1024
  target_kl: 0.02
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  action_entropy_coef_start: 0.01
  action_entropy_coef_end: 0.003
  action_entropy_anneal_updates: 600
  value_loss_type: huber
  huber_delta: 10.0
  log_std_min: -3.0
  log_std_max: 0.2
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  max_grad_norm: 0.5
  save_every: 25
  save_periodic_checkpoints: true
  log_every: 1

evaluation:
  episodes: 100
  interval_updates: 25
  seed_base: 41000
  save_episode_records: false

output:
  output_dir: results/active/team_v4_rule
  checkpoint_dir: results/active/team_v4_rule/checkpoints
  reject_nonempty: true
